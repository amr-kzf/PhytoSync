{% extends "base.html" %}

{% block content %}
<main class="feature-shell py-8">
    <section class="ph-card max-w-2xl mx-auto p-6 sm:p-8">
        <span class="ph-status warning">AI validation warning</span>
        <h1 class="font-display text-3xl sm:text-4xl font-semibold mt-5 mb-3">Review this result carefully</h1>
        <p class="text-gray-600 leading-relaxed mb-5">{{ message }}</p>
        <p class="ph-status info mb-6">Confidence score: {{ confidence }}%</p>
        <a href="{{ url_for('view_topic', topic_id=topic_id) }}" class="ph-secondary-button">Go back</a>
    </section>
</main>
{% endblock %}
