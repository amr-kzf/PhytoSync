<!DOCTYPE html>
<html lang="{{ site_language }}" dir="{{ 'rtl' if site_language == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | PhytoSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_pages.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/phyto_redesign.css') }}">
</head>
<body class="phyto-auth-page bg-light">
{% include "partials/standalone_language_switcher.html" %}

<div class="container d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg rounded-4 p-4">
        <h3 class="text-center fw-bold mb-3">Forgot password</h3>
        <p class="text-muted text-center small">
            Enter your registered email to receive an OTP.
        </p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email address</label>
                <input type="email" name="email" class="form-control" required placeholder="example@email.com">
            </div>

            <button class="btn btn-success w-100 fw-bold rounded-pill">
                Send OTP
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none small">
                ← Back to Login
            </a>
        </div>
    </div>
</div>

{% include "partials/i18n_bootstrap.html" %}
</body>
</html>
